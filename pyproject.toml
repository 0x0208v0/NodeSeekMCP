[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[project]
name = "nodeseekmcp"
dynamic = ["version"]
description = "NodeSeek MCP Server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.13.0",
    "fastapi>=0.120.0",
    "gunicorn>=23.0.0",
    "uvicorn-worker>=0.4.0",
    "httpx[socks]>=0.28.1",
    "feedparser>=6.0.12",
    "arrow>=1.4.0",
    "pendulum>=3.1.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "supervisor>=4.3.0",
    "aiosqlite>=0.21.0",
    "apscheduler>=3.11.0",
    "jinja2>=3.1.6",
    "click>=8.3.0",
    "pydantic-settings>=2.11.0",
]

[project.scripts]
nodeseekmcp = 'nodeseekmcp.cli:cli'

[tool.setuptools.dynamic]
version = { attr = "nodeseekmcp.__version__.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["nodeseekmcp*"]

[tool.setuptools.package-data]
"*" = ["*.*"]
